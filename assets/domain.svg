ssage pipelines for cancer survivors at IDIR Lab.</tspan></text><text x="40" y="207" font-family="GZ, 'Source Serif 4', 'Source Serif Pro', Georgia, serif" font-size="11.5" font-weight="600" fill="#aa0b56" letter-spacing="2">STUDYING</text><text font-family="GZ, 'Source Serif 4', 'Source Serif Pro', Georgia, serif" font-size="16.5" font-weight="400" fill="#201e1d"><tspan x="230" y="208">Computer science at UTA, class of 2027.</tspan></text><text x="40" y="234" font-family="GZ, 'Source Serif 4', 'Source Serif Pro', Georgia, serif" font-size="11.5" font-weight="600" fill="#aa0b56" letter-spacing="2">FAVORITE COLOR</text><text font-family="GZ, 'Source Serif 4', 'Source Serif Pro', Georgia, serif" font-size="16.5" font-weight="400" fill="#201e1d"><tspan x="230" y="235">Pink. Blue is a very close second (see Corrections).</tspan></text><text x="40" y="261" font-family="GZ, 'Source Serif 4', 'Source Serif Pro', Georgia, serif" font-size="11.5" font-weight="600" fill="#aa0b56" letter-spacing="2">WILL TALK ABOUT</text><text font-family="GZ, 'Source Serif 4', 'Source Serif Pro', Georgia, serif" font-size="16.5" font-weight="400" fill="#201e1d"><tspan x="230" y="262">Hackathons, matcha, butterflies, Flower Knows, and Gojo, for hours.</tspan></text><text x="40" y="288" font-family="GZ, 'Source Serif 4', 'Source Serif Pro', Georgia, serif" font-size="11.5" font-weight="600" fill="#aa0b56" letter-spacing="2">ASK ME ABOUT</text><text font-family="GZ, 'Source Serif 4', 'Source Serif Pro', Georgia, serif" font-size="16.5" font-weight="400" fill="#201e1d"><tspan x="230" y="289">Why a 30,000-parameter CNN kept up with the big ones.</tspan></text><text x="40" y="315" font-family="GZ, 'Source Serif 4', 'Source Serif Pro', Georgia, serif" font-size="11.5" font-weight="600" fill="#aa0b56" letter-spacing="2">WEAKNESS</text><text font-family="GZ, 'Source Serif 4', 'Source Serif Pro', Georgia, serif" font-size="16.5" font-weight="400" fill="#201e1d"><tspan x="230" y="316">Sleep. See the ticker.</tspan></text><g transform="translate(420,0) rotate(-2)"><path d="M-55,-12H55L52,-8L55,-4L52,0L55,4L52,8L55,12H-55L-52,8L-55,4L-52,0L-55,-4L-52,-8L-55,-12Z" fill="#ffc0d0" opacity=".85" style="mix-blend-mode:multiply"></path><path d="M-55,-12H55L52,-8L55,-4L52,0L55,4L52,8L55,12H-55L-52,8L-55,4L-52,0L-55,-4L-52,-8L-55,-12Z" fill="url(#flw)" opacity=".7"></path></g></g></svg>