ff1f4" filter="url(#sh)"></path><g style="mix-blend-mode:multiply"><circle cx="45" cy="39" r="2.5" fill="#d6006c"></circle><circle cx="47.9" cy="41.1" r="2.5" fill="#d6006c"></circle><circle cx="46.8" cy="44.4" r="2.5" fill="#d6006c"></circle><circle cx="43.2" cy="44.4" r="2.5" fill="#d6006c"></circle><circle cx="42.1" cy="41.1" r="2.5" fill="#d6006c"></circle><circle cx="45" cy="42" r="1.4" fill="#edbb00"></circle></g><text x="57" y="46" font-family="GZ, 'Source Serif 4', 'Source Serif Pro', Georgia, serif" font-size="11.5" font-weight="600" fill="#006786" letter-spacing="2.2">FRONT PAGE</text><text font-family="GZ, 'Source Serif 4', 'Source Serif Pro', Georgia, serif" font-size="40" font-weight="800" fill="#201e1d"><tspan x="40" y="94">Local girl ships</tspan><tspan x="40" y="138">software, mostly pink</tspan></text><text font-family="GZ, 'Source Serif 4', 'Source Serif Pro', Georgia, serif" font-size="18" font-weight="400" font-style="italic" fill="#605d5d"><tspan x="40" y="174">A computer science senior at UTA who thinks software</tspan><tspan x="40" y="199">should be useful and a little bit cute.</tspan></text><text x="40" y="231" font-family="GZ, 'Source Serif 4', 'Source Serif Pro', Georgia, serif" font-size="11" font-weight="600" fill="#006786" letter-spacing="1.8">BY GHIYA EL DAOUK EL KADI</text><text font-family="GZ, 'Source Serif 4', 'Source Serif Pro', Georgia, serif" font-size="15.5" font-weight="400" fill="#201e1d"><tspan x="40" y="261"><tspan font-weight="700" letter-spacing="1" font-size="12">TEXAS </tspan><tspan font-weight="700" letter-spacing="1" font-size="12">— </tspan>She builds dashboards for cancer research, machine</tspan><tspan x="40" y="284">learning that spots toxic corn, and a tracker for the campus</tspan><tspan x="40" y="307">cats. She also runs ACM at UTA, all 1,900 members of it, and</tspan><tspan x="40" y="330">is the new Executive Director of HackUTA.</tspan></text><text font-family="GZ, 'Source Serif 4', 'Source Serif Pro', Georgia, serif" font-size="15.5" font-weight="400" fill="#201e1d"><tspan x="40" y="364">She graduates in May 2027 and is looking for new-grad roles</tspan><tspan x="40" y="387">in software and machine learning. The editor is taking calls.</tspan></text><g transform="translate(270,0) rotate(-3)"><path d="M-55,-12H55L52,-8L55,-4L52,0L55,4L52,8L55,12H-55L-52,8L-55,4L-52,0L-55,-4L-52,-8L-55,-12Z" fill="#99e0ff" opacity=".85" style="mix-blend-mode:multiply"></path><path d="M-55,-12H55L52,-8L55,-4L52,0L55,4L52,8L55,12H-55L-52,8L-55,4L-52,0L-55,-4L-52,-8L-55,-12Z" fill="url(#flw)" opacity=".7"></path></g></g></svg>